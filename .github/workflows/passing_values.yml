# This is a basic workflow to help you get started with Actions

name: Passing job values

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
jobs:
  pass_in_one_job:
    runs-on: ubuntu-latest
    steps:
      - name: Set color
        id: color-selector
        run: echo "COLOR=blue" >> $GITHUB_OUTPUT
      - name: Get color
        run: echo "The selected color is ${{steps.color-selector.outputs.COLOR}}"
        
  producer:
    runs-on: ubuntu-latest
    outputs:
          message: ${{ steps.sentence_maker.outputs.message }}
    steps:
      - name: Make a sentence
        id: sentence_maker
        run: |
            echo "message=hello" >> $GITHUB_OUTPUT

  consumer:
    runs-on: ubuntu-latest
    needs: producer
    steps:
      - name: Print the message
        run: |
          echo ${{ needs.producer.outputs.message }}

  job_1:
    name: Add 3 and 7
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          expr 3 + 7 > NAZWA_PLIKU_Z_WYNIKIEM
      - uses: actions/upload-artifact@v4
        with:
          name: NAZWA ARTEFAKTU
          path: NAZWA_PLIKU_Z_WYNIKIEM


  job_2:
    name: Multiply by 9
    needs: job_1
    runs-on: windows-latest
    steps:

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: NAZWA ARTEFAKTU

      - shell: bash
        run: |
          value=`cat NAZWA_PLIKU_Z_WYNIKIEM`
          echo $(expr $value \* 9) 
