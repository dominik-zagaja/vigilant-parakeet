on:
  workflow_dispatch:

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - uses: actions/checkout@v4

      - id: foo
        uses: dominik-zagaja/vigilant-parakeet/my-composite-action@master # ⬅ Zmienić
        with:
          who-to-greet: "Dominik" # ⬅ Uwaga

      - run: echo "random-number $RANDOM_NUMBER"
        shell: bash
        env:
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}
